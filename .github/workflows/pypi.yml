name: Build and publish PyPI package

on:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Upload the build to TestPyPI
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Fail fast on a mistagged release before any build starts.
  check_tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release tag
        if: github.ref_type == 'tag'
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$version"

  source:
    needs: check_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Build and verify source distribution
        run: |
          uv build --sdist
          uv build --wheel dist/pysvzerod-*.tar.gz --out-dir /tmp/sdist-wheel
          uvx twine check dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: check_tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v4
      # setup.py builds with Ninja on Windows, which needs cl.exe on PATH.
      - name: Setup MSVC dev cmd
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: pypa/cibuildwheel@v4.3.0
        env:
          # Build every CPython that requires-python allows; skip free-threaded builds.
          CIBW_SKIP: "cp3??t-*"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=11.0"
          CIBW_TEST_REQUIRES: pytest
          # Run the solver test cases and the console script against the installed wheel.
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests/test_solver.py -q &&
            svzerodsolver {project}/tests/cases/steadyFlow_R_R.json svzerodsolver_out.csv
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish_testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi
    needs: [source, wheels]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI runs can repeat a version; keep files already uploaded.
          skip-existing: true

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [source, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
