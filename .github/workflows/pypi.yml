name: Build and publish PyPI package

on:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Upload the build to TestPyPI
        type: boolean
        default: false
  push:
    tags:
      - "v*"

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Check release tag
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build and verify source distribution
        run: |
          uv build --sdist
          uv build --wheel dist/pysvzerod-*.tar.gz --out-dir /tmp/sdist-wheel
          uvx twine check dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v4.3.0
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=11.0"
          CIBW_TEST_COMMAND: >-
            python -c "import importlib.metadata as metadata; import pysvzerod;
            assert metadata.version('pysvzerod') and callable(pysvzerod.simulate)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish_testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi
    needs: [source, wheels]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v5
      - run: uvx twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v5
      - run: uvx twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
