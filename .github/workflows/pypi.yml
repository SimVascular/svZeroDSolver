name: Build and publish PyPI package

on:
  workflow_dispatch:
    inputs:
      destination:
        description: "Upload destination"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
      version_bump:
        description: "Version increment when uploading"
        required: true
        default: minor
        type: choice
        options:
          - minor
          - major
  # Build and test the wheels, without publishing, when packaging changes.
  pull_request:
    paths:
      - .github/workflows/pypi.yml
      - .github/scripts/**
      - setup.py
      - pyproject.toml
      - MANIFEST.in
      - CMakeLists.txt
      - applications/pysvzerod.cpp
      - tests/test_solver.py
      - tests/test_calibrator.py
      - tests/__init__.py
      - tests/conftest.py
      - tests/utils.py
      - tests/cases/**

permissions:
  contents: read

concurrency:
  # Serialize version selection through release recording for each index.
  group: package-release-${{ github.event_name == 'workflow_dispatch' && inputs.destination || github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.version.outputs.current_version }}
      release_version: ${{ steps.version.outputs.release_version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - name: Require the default branch for PyPI releases
        if: inputs.destination == 'pypi'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::PyPI releases must run from $DEFAULT_BRANCH."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Determine build version
        id: version
        env:
          DESTINATION: ${{ inputs.destination }}
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          current_version=$(python .github/scripts/release_version.py current)
          release_version="$current_version"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$DESTINATION" in
              pypi|testpypi)
                release_version=$(python .github/scripts/release_version.py next --bump "$VERSION_BUMP")
                ;;
              *) echo "::error::Unknown upload destination."; exit 1 ;;
            esac
          fi
          source_sha=$(git rev-parse HEAD)
          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          {
            echo "Destination: ${DESTINATION:-none (pull request)}"
            echo "Version: $current_version -> $release_version"
            echo "Source: $source_sha"
          } >> "$GITHUB_STEP_SUMMARY"

  source:
    needs: prepare_release
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_release.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Set build version
        env:
          CURRENT_VERSION: ${{ needs.prepare_release.outputs.current_version }}
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.release_version }}
        run: >-
          python .github/scripts/release_version.py set
          --expected-current "$CURRENT_VERSION" --version "$RELEASE_VERSION"
      - name: Build and verify source distribution
        run: |
          uv build --sdist
          uv build --wheel dist/pysvzerod-*.tar.gz --out-dir /tmp/sdist-wheel
          uvx twine check --strict dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: prepare_release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-15-intel
          - macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_release.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set build version
        env:
          CURRENT_VERSION: ${{ needs.prepare_release.outputs.current_version }}
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.release_version }}
        run: >-
          python .github/scripts/release_version.py set
          --expected-current "$CURRENT_VERSION" --version "$RELEASE_VERSION"
      # setup.py builds with Ninja on Windows, which needs cl.exe on PATH.
      - name: Setup MSVC dev cmd
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: pypa/cibuildwheel@v4.3.0
        env:
          # Build every CPython that requires-python allows; skip free-threaded builds.
          CIBW_SKIP: "cp3??t-*"
          CIBW_ARCHS_LINUX: ${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ENVIRONMENT: "CMAKE_BUILD_PARALLEL_LEVEL=2"
          CIBW_ENVIRONMENT_MACOS: "CMAKE_BUILD_PARALLEL_LEVEL=2 MACOSX_DEPLOYMENT_TARGET=11.0"
          CIBW_TEST_REQUIRES: pytest
          # Check the installed solver, a small calibration case, and the console script.
          CIBW_TEST_COMMAND: >-
            python -m pytest {project}/tests/test_solver.py
            {project}/tests/test_calibrator.py::test_steady_flow_calibration -q &&
            svzerodsolver {project}/tests/cases/steadyFlow_R_R.json svzerodsolver_out.csv
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  validate:
    needs: [prepare_release, source, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_release.outputs.source_sha }}
          persist-credentials: false
      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Validate all distribution metadata
        env:
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.release_version }}
        run: |
          uvx twine check --strict dist/*
          python .github/scripts/release_version.py verify-dist --dist dist --version "$RELEASE_VERSION"
      - name: Store validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && (inputs.destination == 'pypi' || inputs.destination == 'testpypi')
    needs: [prepare_release, validate]
    runs-on: ubuntu-latest
    environment: ${{ inputs.destination }}
    permissions:
      contents: read
      id-token: write
    env:
      DESTINATION: ${{ inputs.destination }}
      RELEASE_VERSION: ${{ needs.prepare_release.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_release.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Confirm production release source is current
        if: inputs.destination == 'pypi'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ needs.prepare_release.outputs.source_sha }}
        run: |
          git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH"
          if [[ "$(git rev-parse FETCH_HEAD)" != "$SOURCE_SHA" ]]; then
            echo "::error::The default branch changed during the build. Start a new workflow run."
            exit 1
          fi
      - name: Check for conflicting uploads
        run: >-
          python .github/scripts/release_version.py check-index
          --index "$DESTINATION" --dist dist --version "$RELEASE_VERSION"
      - name: Stage files for upload
        # The publishing action writes attestations beside its input files.
        run: |
          mkdir upload
          cp dist/*.whl dist/*.tar.gz upload/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          repository-url: ${{ inputs.destination == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: true
      - name: Verify published files and hashes
        run: >-
          python .github/scripts/release_version.py verify-index
          --index "$DESTINATION" --dist dist --version "$RELEASE_VERSION"

  github_release:
    if: github.event_name == 'workflow_dispatch' && inputs.destination == 'pypi'
    needs: [prepare_release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SOURCE_SHA: ${{ needs.prepare_release.outputs.source_sha }}
      CURRENT_VERSION: ${{ needs.prepare_release.outputs.current_version }}
      RELEASE_VERSION: ${{ needs.prepare_release.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_release.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Confirm the production artifacts
        run: >-
          python .github/scripts/release_version.py verify-index
          --index pypi --dist dist --version "$RELEASE_VERSION"
      - name: Record version and tag
        id: record
        run: bash .github/scripts/record_release.sh
      - name: Check existing GitHub release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const tag = `v${process.env.RELEASE_VERSION}`;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              // Tag lookup omits drafts left by interrupted asset uploads.
              const matches = (await github.paginate(github.rest.repos.listReleases, {
                ...context.repo, per_page: 100
              })).filter(item => item.tag_name === tag);
              if (matches.length > 1) throw new Error(`Multiple releases found for ${tag}`);
              release = matches[0];
              if (!release) {
                core.setOutput('exists', 'false');
                core.setOutput('complete', 'false');
                return;
              }
            }
            if (release.prerelease) throw new Error(`Unexpected prerelease for ${tag}`);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.id, per_page: 100
            });
            const expected = new Map(fs.readdirSync('dist').map(name => [
              name, 'sha256:' + crypto.createHash('sha256').update(fs.readFileSync(`dist/${name}`)).digest('hex')
            ]));
            const seen = new Set();
            for (const asset of assets) {
              if (!expected.has(asset.name) || seen.has(asset.name) ||
                  asset.state !== 'uploaded' || asset.digest !== expected.get(asset.name)) {
                throw new Error(`Existing release asset does not match: ${asset.name}`);
              }
              seen.add(asset.name);
            }
            core.setOutput('exists', 'true');
            core.setOutput('complete', String(!release.draft && seen.size === expected.size));
      - name: Create GitHub release
        if: steps.release.outputs.complete != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare_release.outputs.release_version }}
          name: pysvzerod ${{ needs.prepare_release.outputs.release_version }}
          target_commitish: ${{ steps.record.outputs.commit_sha }}
          generate_release_notes: ${{ steps.release.outputs.exists != 'true' }}
          overwrite_files: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
